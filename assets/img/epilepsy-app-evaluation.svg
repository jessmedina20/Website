<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Evaluating epilepsy apps against everyday needs</title>
  <desc id="desc">A research scorecard connects twenty-five apps and 2,026 reviews to feature coverage, accessibility, quality, and lived experience.</desc>
  <rect width="800" height="500" fill="#fffdf8"/>
  <g font-family="DM Sans,Arial,sans-serif">
    <text x="48" y="48" fill="#17201e" font-size="20" font-weight="600">FROM APP PROMISES TO EVERYDAY FIT</text><text x="48" y="75" fill="#606965" font-size="14">A multi-layer evaluation of what tools offer—and what people actually need.</text>
    <g transform="translate(48 112)">
      <rect width="160" height="84" fill="#17201e"/><text x="18" y="39" fill="#fffdf8" font-size="30" font-weight="600">25</text><text x="18" y="62" fill="#d9e8e4" font-size="12">EPILEPSY APPS</text>
      <rect y="96" width="160" height="84" fill="#d9e8e4"/><text x="18" y="135" fill="#0e4d48" font-size="30" font-weight="600">2,026</text><text x="18" y="158" fill="#0e4d48" font-size="12">PUBLIC REVIEWS</text>
      <rect y="192" width="160" height="84" fill="#efe8dc"/><text x="18" y="231" fill="#7b3f2a" font-size="30" font-weight="600">19</text><text x="18" y="254" fill="#7b3f2a" font-size="12">INTERVIEWEES</text>
      <path d="M188 138H236M226 130l10 8-10 8" fill="none" stroke="#a44f32" stroke-width="2"/>
      <g transform="translate(254 0)"><text x="0" y="14" fill="#176b64" font-size="12" font-weight="600" letter-spacing="1.2">EVALUATION LAYERS</text>
        <g font-size="15" fill="#17201e"><text x="0" y="58">Feature coverage</text><text x="0" y="112">Accessibility</text><text x="0" y="166">Quality</text><text x="0" y="220">Lived experience</text></g>
        <g fill="none" stroke="#cbc7bd"><rect x="164" y="36" width="226" height="28"/><rect x="164" y="90" width="226" height="28"/><rect x="164" y="144" width="226" height="28"/><rect x="164" y="198" width="226" height="28"/></g>
        <g fill="#176b64"><rect x="164" y="36" width="82" height="28"/><rect x="164" y="90" width="56" height="28"/><rect x="164" y="144" width="112" height="28"/><rect x="164" y="198" width="146" height="28"/></g>
        <text x="0" y="274" fill="#606965" font-size="12">Bars indicate analytic lenses—not comparative scores.</text>
      </g>
      <line x1="0" y1="306" x2="704" y2="306" stroke="#17201e"/><text x="0" y="338" fill="#a44f32" font-size="12" font-weight="600" letter-spacing="1.1">DESIGN IMPLICATION</text><text x="0" y="364" fill="#17201e" font-family="Newsreader,Georgia,serif" font-size="20">Reduce burden. Preserve agency. Connect care contexts.</text>
    </g>
  </g>
</svg>
