<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Support needs across the epilepsy life course</title>
  <desc id="desc">A matrix shows how recurring support needs intersect adolescence, adulthood, later life, and caregiving, with online communities carrying experiential knowledge across stages.</desc>
  <rect width="800" height="500" fill="#fffdf8"/>
  <g font-family="DM Sans,Arial,sans-serif">
    <text x="48" y="48" fill="#17201e" font-size="20" font-weight="600">WHAT CHANGES—AND WHAT PERSISTS</text>
    <text x="48" y="75" fill="#606965" font-size="14">Support needs shift across age and role, but rarely disappear.</text>
    <g transform="translate(48 112)">
      <g fill="#176b64" font-size="12" font-weight="600" letter-spacing="1.2"><text x="252" y="0">ADOLESCENCE</text><text x="378" y="0">ADULTHOOD</text><text x="494" y="0">LATER LIFE</text><text x="610" y="0">CAREGIVING</text></g>
      <line x1="222" y1="18" x2="704" y2="18" stroke="#17201e"/>
      <g fill="#17201e" font-size="14"><text x="0" y="62">Understanding symptoms</text><text x="0" y="112">Treatment decisions</text><text x="0" y="162">Independence + safety</text><text x="0" y="212">Emotional reassurance</text><text x="0" y="262">Care coordination</text></g>
      <g stroke="#cbc7bd"><line x1="0" y1="78" x2="704" y2="78"/><line x1="0" y1="128" x2="704" y2="128"/><line x1="0" y1="178" x2="704" y2="178"/><line x1="0" y1="228" x2="704" y2="228"/><line x1="0" y1="278" x2="704" y2="278"/></g>
      <g fill="#176b64"><circle cx="280" cy="57" r="8"/><circle cx="400" cy="57" r="8"/><circle cx="520" cy="57" r="8"/><circle cx="640" cy="57" r="8"/><circle cx="280" cy="107" r="8"/><circle cx="400" cy="107" r="8"/><circle cx="520" cy="107" r="8"/><circle cx="640" cy="107" r="8"/><circle cx="280" cy="157" r="8"/><circle cx="400" cy="157" r="8"/><circle cx="520" cy="157" r="8"/><circle cx="640" cy="157" r="8"/><circle cx="280" cy="207" r="8"/><circle cx="400" cy="207" r="8"/><circle cx="520" cy="207" r="8"/><circle cx="640" cy="207" r="8"/><circle cx="400" cy="257" r="8"/><circle cx="520" cy="257" r="8"/><circle cx="640" cy="257" r="8"/></g>
      <circle cx="280" cy="257" r="7" fill="none" stroke="#a44f32" stroke-width="2"/>
      <rect x="0" y="310" width="704" height="58" fill="#17201e"/>
      <text x="22" y="335" fill="#fffdf8" font-size="13" font-weight="600">ONLINE COMMUNITIES</text><text x="22" y="355" fill="#d9e8e4" font-size="12">Experiential knowledge bridges clinical visits and everyday life.</text>
    </g>
  </g>
</svg>
